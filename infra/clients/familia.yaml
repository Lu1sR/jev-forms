# Gestor instance for Luis's family (test client). One file per client; deploy with
#   npx aws-cdk@2 deploy -c client=familia
# Secrets are not here: they live in SSM Parameter Store under /gestor/<client>/
# (scripts/put-secrets.sh).

client: familia
az: us-east-2a

instance:
  type: t4g.medium         # ARM; 4 GB: paperless + n8n (flows). t4g.small without flows
  root_volume_gb: 16       # OS + images + swap
  data_volume_gb: 20       # Postgres + documents (EBS, kept on stack delete)
  swap_gb: 4

gestor:
  domain: docs.luis-dev.com
  ingress: tunnel          # tunnel | caddy
  app_title: Gestor
  admin_user: admin
  ocr_language: spa+eng
  date_order: DMY
  date_parser_languages: es+en
  search_language: es
  time_zone: America/Guayaquil

smtp:
  host: smtp.resend.com
  port: 587
  user: resend
  from: "Gestor <gestor@luis-dev.com>"

backup:
  time: "03:00"              # local time (gestor.time_zone)
  snapshot_retention_days: 7 # AWS Backup EBS snapshots
  s3_noncurrent_days: 30     # how long overwritten/deleted files stay recoverable in S3

alerts:
  email: luishrt1997@gmail.com # alarms and budget notices; empty = no notifications
  monthly_budget_usd: 25

# Automations (n8n next to paperless; gestor/deploy/flows/README.md). Secrets in SSM:
# N8N_*, FLOWS_WEBHOOK_SECRET, FORMULARIOS_API_KEY, PAPERLESS_FLOWS_TOKEN, GOOGLE_SA_JSON.
flows:
  enabled: true
  formularios_url: https://formularios-api.docutecec.com   # public URL of the engine
  sheets_id: "1KD02mdX0sNfq5DnDXz14Y93bxkH6NdGK-oWxpkcNUUY"   # spreadsheet id of the "sheets" flow
  sheets_tab: Facturas
