# Gestor for one client: paperless-ngx (docutecec image) + Postgres + Redis + Tika +
# Gotenberg, sized to fit a 2 GB VM with swap. The same file runs locally and on EC2;
# everything that differs lives in .env (see .env.example).
#
# Ingress, chosen with a profile:
#   (none)                 only 127.0.0.1:${GESTOR_LOCAL_PORT}, for local tests or SSM port forwarding
#   --profile tunnel       Cloudflare Tunnel, no inbound ports open on the host
#   --profile caddy        Caddy with Let's Encrypt on 80/443, for clients without Cloudflare
#
# Flows (optional, --profile flows): n8n runs the automations described in flows/README.md.
# Paperless calls it over the internal network; the editor is only reachable on
# 127.0.0.1:${N8N_LOCAL_PORT} (local tests or SSM port forwarding). Needs a 4 GB VM.
#
# All state lives under ${DATA_ROOT} (on EC2 the separate encrypted EBS volume), so a
# snapshot of that volume captures the whole instance.

name: gestor

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  paperless:
    <<: [*restart, *logging]
    image: ${GESTOR_IMAGE:-gestor:local}
    build:
      context: ..
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
      tika:
        condition: service_started
      gotenberg:
        condition: service_started
    ports:
      - "127.0.0.1:${GESTOR_LOCAL_PORT:-8000}:8000"
    volumes:
      - ${DATA_ROOT:-./data}/paperless/data:/usr/src/paperless/data
      - ${DATA_ROOT:-./data}/paperless/media:/usr/src/paperless/media
      - ${DATA_ROOT:-./data}/paperless/consume:/usr/src/paperless/consume
      - ${DATA_ROOT:-./data}/paperless/export:/usr/src/paperless/export
    environment:
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?set PAPERLESS_SECRET_KEY}
      PAPERLESS_URL: ${PAPERLESS_URL:?set PAPERLESS_URL}
      # Cloudflare and Caddy both terminate TLS and forward X-Forwarded-Proto.
      PAPERLESS_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO", "https"]'
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?set PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_ADMIN_MAIL: ${PAPERLESS_ADMIN_MAIL:-root@localhost}

      # Branding
      PAPERLESS_APP_TITLE: ${GESTOR_APP_TITLE:-Gestor}
      PAPERLESS_APP_LOGO: /logo/docutecec_logo.svg

      # Language and dates (per client)
      PAPERLESS_OCR_LANGUAGE: ${GESTOR_OCR_LANGUAGE:-spa+eng}
      PAPERLESS_DATE_ORDER: ${GESTOR_DATE_ORDER:-DMY}
      PAPERLESS_DATE_PARSER_LANGUAGES: ${GESTOR_DATE_PARSER_LANGUAGES:-es+en}
      PAPERLESS_SEARCH_LANGUAGE: ${GESTOR_SEARCH_LANGUAGE:-es}
      PAPERLESS_TIME_ZONE: ${GESTOR_TIME_ZONE:-America/Guayaquil}
      # PDF/A copy of every document, digital PDFs included.
      PAPERLESS_ARCHIVE_FILE_GENERATION: always

      # Office documents and .eml
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000

      # Memory: one OCR task at a time and one web worker fit in 2 GB.
      PAPERLESS_TASK_WORKERS: ${GESTOR_TASK_WORKERS:-1}
      PAPERLESS_THREADS_PER_WORKER: ${GESTOR_THREADS_PER_WORKER:-1}
      PAPERLESS_WEBSERVER_WORKERS: ${GESTOR_WEBSERVER_WORKERS:-1}

      # SSRF: mail, remote OCR and AI must not reach the host or the VPC. Webhooks
      # may: they target n8n on this compose network (only admins edit workflows, and
      # on EC2 the metadata endpoint is already out of reach: IMDSv2, hop limit 1).
      PAPERLESS_WEBHOOKS_ALLOW_INTERNAL_REQUESTS: "true"
      PAPERLESS_EMAIL_ALLOW_INTERNAL_HOSTS: "false"
      PAPERLESS_REMOTE_OCR_ALLOW_INTERNAL_ENDPOINTS: "false"
      PAPERLESS_AI_LLM_ALLOW_INTERNAL_ENDPOINTS: "false"

      # Outgoing mail (password reset, send by email). Empty host disables it.
      PAPERLESS_EMAIL_HOST: ${SMTP_HOST:-}
      PAPERLESS_EMAIL_PORT: ${SMTP_PORT:-587}
      PAPERLESS_EMAIL_HOST_USER: ${SMTP_USER:-}
      PAPERLESS_EMAIL_HOST_PASSWORD: ${SMTP_PASSWORD:-}
      PAPERLESS_EMAIL_FROM: ${SMTP_FROM:-}
      PAPERLESS_EMAIL_USE_TLS: ${SMTP_USE_TLS:-true}

  db:
    <<: [*restart, *logging]
    image: docker.io/library/postgres:18
    # Small buffers: the VM has 2 GB shared with OCR, Tika and Gotenberg.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes:
      - ${DATA_ROOT:-./data}/postgres:/var/lib/postgresql
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 10

  broker:
    <<: [*restart, *logging]
    image: docker.io/valkey/valkey:9-alpine
    command: ["valkey-server", "--maxmemory", "64mb", "--save", "60", "1"]
    volumes:
      - ${DATA_ROOT:-./data}/redis:/data

  tika:
    <<: [*restart, *logging]
    image: docker.io/apache/tika:3.3.1.0
    environment:
      # Applies to the server and to the parsing child it forks.
      JAVA_TOOL_OPTIONS: ${TIKA_JAVA_OPTS:--Xmx256m -XX:+UseSerialGC}
    mem_limit: ${TIKA_MEM_LIMIT:-700m}

  gotenberg:
    <<: [*restart, *logging]
    image: docker.io/gotenberg/gotenberg:8.37
    # Chromium converts .eml; no JavaScript or external content (tracking pixels).
    # Chromium and LibreOffice start on first use and restart after a few
    # conversions so idle memory stays low.
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
      - --chromium-restart-after=5
      - --libreoffice-restart-after=5
    mem_limit: ${GOTENBERG_MEM_LIMIT:-700m}

  # --- flows: n8n ------------------------------------------------------------------
  # One-shot: creates the n8n role and database in the shared Postgres (idempotent) and
  # gives the n8n data folder to the uid n8n runs as. Re-runs harmlessly on every start.
  flows-init:
    <<: *logging
    profiles: [flows]
    image: docker.io/library/postgres:18
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: paperless
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
    volumes:
      - ${DATA_ROOT:-./data}/n8n:/n8n-data
    entrypoint: ["/bin/sh", "-ec"]
    # The password reaches psql as a variable (never on the command line); \gexec runs
    # the generated statements only when the role or database is missing.
    command:
      - |
        psql -v ON_ERROR_STOP=1 -v pw="$$N8N_DB_PASSWORD" -d paperless <<'SQL'
        SELECT format('CREATE ROLE n8n LOGIN PASSWORD %L', :'pw') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'n8n') \gexec
        ALTER ROLE n8n PASSWORD :'pw';
        SELECT 'CREATE DATABASE n8n OWNER n8n' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'n8n') \gexec
        SQL
        chown -R 1000:1000 /n8n-data
        echo "[flows-init] n8n database ready"

  n8n:
    <<: [*restart, *logging]
    profiles: [flows]
    image: docker.io/n8nio/n8n:2.43.1
    depends_on:
      flows-init:
        condition: service_completed_successfully
      paperless:
        condition: service_started
    ports:
      - "127.0.0.1:${N8N_LOCAL_PORT:-5678}:5678"
    volumes:
      - ${DATA_ROOT:-./data}/n8n:/home/node/.n8n
      - ./flows:/flows:ro
    environment:
      # Reached only through the compose network (Paperless) or a local port forward.
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      # URL Paperless posts to; the editor shows it on Webhook nodes.
      N8N_WEBHOOK_URL: http://n8n:5678/
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-0}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      # Flows read their settings (Paperless URL, Formularios URL, sheet id) from $env.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
      DB_POSTGRESDB_POOL_SIZE: 2
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTIONS_MAX_AGE_HOURS:-720}
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 5000
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      GENERIC_TIMEZONE: ${GESTOR_TIME_ZONE:-America/Guayaquil}
      TZ: ${GESTOR_TIME_ZONE:-America/Guayaquil}
      NODE_OPTIONS: ${N8N_NODE_OPTIONS:---max-old-space-size=512}
      # Settings the flows read with $env (secrets go in n8n credentials, see flows/)
      PAPERLESS_BASE_URL: http://paperless:8000
      PAPERLESS_PUBLIC_URL: ${PAPERLESS_URL:?set PAPERLESS_URL}
      FORMULARIOS_URL: ${FORMULARIOS_URL:-}
      FLOWS_SHEETS_ID: ${FLOWS_SHEETS_ID:-}
      FLOWS_SHEETS_TAB: ${FLOWS_SHEETS_TAB:-Facturas}
    mem_limit: ${N8N_MEM_LIMIT:-700m}

  cloudflared:
    <<: [*restart, *logging]
    profiles: [tunnel]
    image: docker.io/cloudflare/cloudflared:2025.9.1
    # The tunnel's public hostname (set in Cloudflare Zero Trust) must point to
    # http://paperless:8000.
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - paperless

  caddy:
    <<: [*restart, *logging]
    profiles: [caddy]
    image: docker.io/library/caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      GESTOR_DOMAIN: ${GESTOR_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT:-./data}/caddy:/data
    depends_on:
      - paperless
