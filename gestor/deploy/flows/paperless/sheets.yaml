# Flow "sheets": invoices tagged flujo:sheets are read by Formularios; the fields land
# in Paperless custom fields and one row per invoice goes to a Google Sheet.
# Applied with: python3 paperless_setup.py --url <paperless> --user admin sheets
# (idempotent: existing objects are matched by name and updated).
flow: sheets

tags:
  - name: flujo:sheets            # entry: a person (or a mail rule) adds it
    color: "#1f6feb"
  - name: flujo:sheets:procesando # set by n8n while it works, so its own writes do not re-trigger
    color: "#8b949e"
  - name: flujo:sheets:ok         # exit: fields filled, row written
    color: "#2da44e"
  - name: flujo:sheets:revisar    # exit: some field is doubtful; a person checks
    color: "#d4a72c"
  - name: flujo:sheets:error      # exit: the flow failed after retries; see the note
    color: "#cf222e"

custom_fields:
  - { name: "RUC emisor",         data_type: string }
  - { name: "Número de factura",  data_type: string }
  - { name: "Fecha de emisión",   data_type: date }
  - { name: "Subtotal",           data_type: monetary, default_currency: USD }
  - { name: "IVA",                data_type: monetary, default_currency: USD }
  - { name: "Total",              data_type: monetary, default_currency: USD }
  - { name: "Clave de acceso",    data_type: string }

# The service user n8n authenticates as. Created without a usable password; the API
# token is printed once (store it as PAPERLESS_FLOWS_TOKEN).
service_user:
  username: flujos
  permissions:
    - documents.view_document
    - documents.change_document
    - documents.view_tag
    - documents.view_customfield
    - documents.add_note
    - documents.view_note
    - documents.delete_note

saved_views:
  - name: "Facturas por revisar (Sheets)"
    show_on_dashboard: true
    show_in_sidebar: true
    tags_all: [flujo:sheets:revisar]
  - name: "Facturas en Sheets"
    show_in_sidebar: true
    tags_all: [flujo:sheets:ok]

# Native workflow: whenever a document gains flujo:sheets (on add or on edit) and has
# none of the exit tags, give the service user edit rights and call n8n.
workflow:
  name: "Flujo sheets → n8n"
  triggers:
    - type: document_added
      has_tags: [flujo:sheets]
      has_not_tags: [flujo:sheets:procesando, flujo:sheets:ok, flujo:sheets:revisar, flujo:sheets:error]
    - type: document_updated
      has_tags: [flujo:sheets]
      has_not_tags: [flujo:sheets:procesando, flujo:sheets:ok, flujo:sheets:revisar, flujo:sheets:error]
  actions:
    - type: assignment
      change_users: [flujos]
    - type: webhook
      url: http://n8n:5678/webhook/paperless-sheets
      params: { doc_id: "{{doc_id}}", flow: sheets }   # sent as a JSON object
      secret_header: X-Flows-Secret       # value: FLOWS_WEBHOOK_SECRET
